# Run the test suite on CPU and measure the coverage of the spatialarena package.
# On a push to main, the coverage is also written to the `badges` branch as a shields.io endpoint file
# (coverage.json), which the README's coverage badge reads. No third-party service or token is involved: the push
# uses the workflow's own GITHUB_TOKEN.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the coverage badge to the `badges` branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: |
          set -euo pipefail
          # open3d's import needs the EGL/GL and OpenMP runtimes, which the runner image lacks.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libgomp1
          python -m pip install --upgrade pip
          # The CPU build of PyTorch first, so the package install does not pull a CUDA build.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" "pytest-cov>=5"

      - name: Test
        run: |
          python -m pytest test/ -q -p no:cacheprovider \
            --cov=spatialarena --cov-report=term:skip-covered --cov-report=json:coverage.json

      - name: Write the coverage badge
        # Also after failed tests: the coverage was still measured.
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('coverage.json') != '' }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json

          percent = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = next(c for limit, c in ((90, "brightgreen"), (75, "green"), (60, "yellowgreen"),
                                          (40, "yellow"), (0, "orange")) if percent >= limit)
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{percent:.0f}%", "color": color}
          json.dump(badge, open("coverage-badge.json", "w"))
          print(badge)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git worktree add --detach _badges FETCH_HEAD
          else
            git worktree add --orphan -b badges _badges
          fi
          cp coverage-badge.json _badges/coverage.json
          cd _badges
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage unchanged"
          else
            git commit -q -m "Update coverage badge (${GITHUB_SHA::7})"
            git push origin HEAD:badges
          fi
