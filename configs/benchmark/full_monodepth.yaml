# Full benchmark: MonoDepth (full-depth suite).
# Every registered method on each track the task/track matrix (spatialarena/task_track_matrix.py) allows for
# MonoDepth and the method supports.
#
#   python -m spatialarena.run_config configs/benchmark/full_monodepth.yaml plan     # the planned runs
#   python -m spatialarena.run_config configs/benchmark/full_monodepth.yaml generate # write the job scripts for review
#   python -m spatialarena.run_config configs/benchmark/full_monodepth.yaml coverage # compare with the canonical case lists
#   python -m spatialarena.run_config configs/benchmark/full_monodepth.yaml submit   # submit (max_in_flight runs queued)
#
# Results go to the canonical report folders (spatialarena/report_layout.py); scripts and SLURM logs to
# <experiment_root>/<experiment_name>/.

job_system: slurm
benchmark_root: ${SPATIALARENA_ROOT}/benchmarks
experiment_root: ${SPATIALARENA_ROOT}/benchmarks/_eval_job_scripts
experiment_name: full_monodepth
max_in_flight: 16
slurm_exclude: []
# 12 h instead of the engine's 48 h inference limit: past inference jobs ran under 3 h, and a shorter limit lets
# jobs backfill onto idle nodes ahead of an upcoming reservation instead of waiting for it to end.
slurm_resources: {infer: {time: "12:00:00"}}

datasets:
  - {task: MonoDepth, dataset: marigold}
  - {task: MonoDepth, dataset: aerialmetric}
  - {task: MonoDepth, dataset: hammer}
  - {task: MonoDepth, dataset: ibims1}
  - {task: MonoDepth, dataset: spring}
  - {task: MonoDepth, dataset: synth4k}
  - {task: MonoDepth, dataset: spatialarena}

models:
  - {name: DA3-L, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: DA3-G, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: DA3-NGL, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: VGGT, track: rgb, env: {SPATIAL_POLICY: shared, INFER_CASE_PARALLELISM: 1}}  # ~71 GiB per 100-image batch
  - {name: AMB3R, track: rgb}
  - {name: PI3_X, track: rgb}
  - {name: FASTVGGT, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: COME, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: CUT3R, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: FAST3R, track: rgb}
  - {name: VGGT_OMEGA, track: rgb, env: {SPATIAL_POLICY: shared-pad}}
  - {name: MAPANYTHING, track: rgb}
  - {name: OMNIVGGT, track: rgb}
  - {name: DEJAVIEW, track: rgb}
  - {name: IGGT, track: rgb, env: {INFER_CASE_PARALLELISM: 1}}  # ~73 GiB per 100-image batch
  - {name: IGGT4D, track: rgb}
  - {name: POW3R, track: rgb}
  - {name: DUST3R, track: rgb}
  - {name: MAST3R, track: rgb}
  - {name: ROBUSTVGGT, track: rgb, env: {SPATIAL_POLICY: shared}}
  - {name: DEPTHVLM, track: rgb}
  - {name: VLM3, track: rgb}
  - {name: DEPTHLM, track: rgb}
  - {name: SENSENOVA_VISION, track: rgb}
  - {name: QWEN3_VL, track: rgb}
  - {name: GENCEPTION_DEPTH, track: rgb}
  # Official single-image MonoDepth baselines (scripts/inference/single_image_depth.py; MonoDepth only).
  - {name: MOGE, track: rgb}
  - {name: MOGE2, track: rgb}
  - {name: MOGE3, track: rgb}
  - {name: MARIGOLD, track: rgb}
  - {name: MARIGOLD_V1_1, track: rgb}
  # Marigold V2 (Log-stage2; docs/benchmark/depth_methods.md): native size rounded to 16, except Marigold's ETH3D
  # subset at the validated 1008x672 (native was clearly worse there). One adapter call per image-size group, since
  # the official program loads the model on every call; its Qwen-Image-Edit backbone needs 96 GB of host memory.
  - name: MARIGOLD_V2
    track: rgb
    env: {MARIGOLD_V2_SCENE_SIZES: marigold/eth3d=1008x672, MAX_IMAGES_PER_RUN: 0}
    slurm_resources: {infer: {mem: 96G}}
  - {name: LOTUS_D, track: rgb}
  - {name: DEPTH_PRO, track: rgb}
  - {name: UNIDEPTH_V2, track: rgb}
  - {name: INFINIDEPTH, track: rgb}
